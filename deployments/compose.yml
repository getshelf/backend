services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-getshelf}
      POSTGRES_USER: ${DB_USERNAME:-getshelf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-getshelf}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://getshelf:getshelf@db:5432/getshelf?sslmode=disable
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../:/app

volumes:
  postgres_data:
