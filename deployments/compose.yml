services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-getshelf}
      POSTGRES_USER: ${DB_USERNAME:-getshelf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-getshelf}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.11.10
    environment:
      SWAGGER_JSON: /openapi.yaml
      URL: /openapi.yaml
    volumes:
      - ../api/openapi.yaml:/openapi.yaml:ro
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
